<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>鹏仔传媒</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%; height: 100%; overflow: hidden; background: #f5f3ee;
        font-family: "Microsoft YaHei UI", "Segoe UI", "PingFang SC", sans-serif;
        -webkit-user-select: none; user-select: none; cursor: default;
      }
      .startup-splash {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        overflow: hidden; background: transparent;
        animation: startup-shell 0.32s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .startup-aura {
        position: absolute; border-radius: 999px; opacity: 0;
        transform: translate3d(0, 0, 0) scale(0.72); will-change: opacity, transform;
      }
      .startup-aura-one {
        width: min(58vw, 760px); height: min(58vw, 760px);
        background: radial-gradient(circle, rgba(255, 220, 150, 0.22) 0%, rgba(255, 220, 150, 0.11) 26%, transparent 62%);
        animation: startup-aura-rise 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.04s both;
      }
      .startup-aura-two {
        width: min(42vw, 520px); height: min(42vw, 520px);
        background: radial-gradient(circle, rgba(176, 116, 48, 0.18) 0%, rgba(176, 116, 48, 0.08) 32%, transparent 68%);
        animation: startup-aura-rise 1.9s cubic-bezier(0.16, 1, 0.3, 1) 0.18s both reverse;
      }
      .startup-wordmark {
        position: relative; display: flex; width: min(100%, 56rem); flex-direction: column;
        align-items: center; padding: 0 2rem; text-align: center; transform-style: preserve-3d;
        backface-visibility: hidden; will-change: transform, opacity;
        animation: startup-wordmark-exit 0.52s cubic-bezier(0.64, 0, 0.78, 0) 1.86s both;
      }
      .startup-kicker {
        margin-bottom: 18px; color: rgba(112, 77, 39, 0.72); font-size: 12px; font-weight: 800;
        letter-spacing: 0.34em; line-height: 1; opacity: 0; transform: translate3d(0, 10px, 0);
        animation: startup-kicker-enter 0.58s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
      }
      .startup-title {
        position: relative; isolation: isolate; font-size: clamp(3.75rem, 8vw, 6rem); font-weight: 900;
        line-height: 1; letter-spacing: 0.02em; color: transparent;
        background: linear-gradient(180deg, #fff8d8 0%, #e9ba63 22%, #8b4f1d 49%, #f7d688 73%, #5b3517 100%);
        background-size: 100% 180%; -webkit-background-clip: text; background-clip: text;
        filter: drop-shadow(0 2px 0 rgba(255, 255, 255, 0.72)) drop-shadow(0 18px 32px rgba(88, 54, 24, 0.26));
        will-change: transform, opacity, background-position;
        animation: startup-title-enter 0.86s cubic-bezier(0.16, 1, 0.3, 1) 0.16s both, startup-text-shine 1.28s ease-out 0.44s both;
      }
      .startup-title::before {
        content: "鹏仔传媒"; position: absolute; inset: 0; z-index: -1; color: rgba(255, 214, 128, 0.16);
        transform: translate3d(0, 8px, 0) scale(1.035); filter: blur(2px);
      }
      .startup-title::after {
        content: ""; position: absolute; inset: -10px -28px;
        background: linear-gradient(110deg, transparent 0%, transparent 38%, rgba(255, 255, 255, 0.98) 47%, rgba(255, 219, 137, 0.8) 50%, transparent 61%, transparent 100%);
        mix-blend-mode: screen; transform: translate3d(-138%, 0, 0) skewX(-12deg);
        animation: startup-light-sweep 1.08s ease-out 0.58s both;
      }
      .startup-energy-line {
        position: relative; width: min(54vw, 520px); height: 2px; margin-top: 24px; overflow: hidden;
        border-radius: 999px; background: rgba(130, 87, 43, 0.14); transform: scaleX(0); transform-origin: center;
        animation: startup-line-enter 0.76s cubic-bezier(0.16, 1, 0.3, 1) 0.74s both;
      }
      .startup-energy-line::after {
        content: ""; position: absolute; inset: 0;
        background: linear-gradient(90deg, transparent, #8b5a25 16%, #fff0b5 50%, #8b5a25 84%, transparent);
        transform: translate3d(-100%, 0, 0); animation: startup-line-sweep 1.1s ease-out 0.9s both;
      }
      .startup-subtitle {
        margin-top: 1.5rem; font-size: clamp(1.25rem, 2.2vw, 1.5rem); font-weight: 600; line-height: 1.25;
        letter-spacing: 0.08em; color: rgba(48, 36, 24, 0.9);
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.72), 0 12px 24px rgba(82, 55, 30, 0.18);
        will-change: transform, opacity;
        animation: startup-subtitle-enter 0.68s cubic-bezier(0.22, 1, 0.36, 1) 0.78s both;
      }
      @keyframes startup-shell { 0% { opacity: 0; } 100% { opacity: 1; } }
      @keyframes startup-title-enter {
        0% { opacity: 0; transform: translate3d(0, 28px, 0) scale(0.88); filter: drop-shadow(0 0 0 rgba(255, 255, 255, 0)) drop-shadow(0 0 0 rgba(124, 73, 28, 0)); }
        62% { opacity: 1; transform: translate3d(0, -2px, 0) scale(1.035); }
        100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
      }
      @keyframes startup-subtitle-enter { 0% { opacity: 0; transform: translate3d(0, 12px, 0); } 100% { opacity: 1; transform: translate3d(0, 0, 0); } }
      @keyframes startup-text-shine { 0% { background-position: 50% 0%; } 100% { background-position: 50% 100%; } }
      @keyframes startup-light-sweep {
        0% { opacity: 0; transform: translate3d(-138%, 0, 0) skewX(-12deg); }
        24% { opacity: 1; }
        100% { opacity: 0; transform: translate3d(138%, 0, 0) skewX(-12deg); }
      }
      @keyframes startup-kicker-enter { 0% { opacity: 0; transform: translate3d(0, 10px, 0); } 100% { opacity: 1; transform: translate3d(0, 0, 0); } }
      @keyframes startup-line-enter { 0% { opacity: 0; transform: scaleX(0); } 100% { opacity: 1; transform: scaleX(1); } }
      @keyframes startup-line-sweep { 0% { transform: translate3d(-100%, 0, 0); } 100% { transform: translate3d(100%, 0, 0); } }
      @keyframes startup-aura-rise {
        0% { opacity: 0; transform: translate3d(0, 16px, 0) scale(0.72); }
        45% { opacity: 1; }
        100% { opacity: 0.36; transform: translate3d(0, 0, 0) scale(1); }
      }
      @keyframes startup-wordmark-exit {
        0% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
        100% { opacity: 0; transform: translate3d(0, -10px, 0) scale(0.985); }
      }
      @media (prefers-reduced-motion: reduce) {
        .startup-splash, .startup-aura, .startup-kicker, .startup-energy-line, .startup-energy-line::after,
        .startup-wordmark, .startup-title, .startup-title::before, .startup-title::after, .startup-subtitle {
          animation-duration: 1ms !important; animation-delay: 0ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="startup-splash">
      <div class="startup-aura startup-aura-one"></div>
      <div class="startup-aura startup-aura-two"></div>
      <div class="startup-wordmark">
        <div class="startup-kicker">PENGZAI MEDIA</div>
        <div class="startup-title">鹏仔传媒</div>
        <div class="startup-energy-line"></div>
        <div class="startup-subtitle">主播数据管理系统</div>
      </div>
    </div>
  </body>
</html>
