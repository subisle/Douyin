syntax = "proto3";

option java_multiple_files = true;
option java_package = "cool.scx.live_room_watcher.impl.douyin_hack.proto.webcast.im";

package webcast.im;

import "douyin_hack/webcast/data/User.proto";
import "douyin_hack/webcast/data/GiftStruct.proto";
import "douyin_hack/webcast/im/Common.proto";

// 更新时间 : 2026-06-29
message GiftMessage {
    webcast.im.Common common = 1;
    int64 gift_id = 2;
    int64 fan_ticket_count = 3;
    int64 group_count = 4;
    int64 repeat_count = 5;
    int64 combo_count = 6;
    webcast.data.User user = 7;
    webcast.data.User to_user = 8;
    int32 repeat_end = 9;
    int64 group_id = 11;
    int64 income_taskgifts = 12;
    int64 room_fan_ticket_count = 13;
    webcast.data.GiftStruct gift = 15;
    string log_id = 16;
    int64 send_type = 17;
    int64 banned_display_effects = 20;
    bool display_for_self = 25;
    string interact_gift_info = 26;
    string diy_item_info = 27;
    repeated int64 min_asset_set = 28;
    int64 total_count = 29;
    int32 client_gift_source = 30;
    repeated int64 to_user_ids = 32;
    int64 send_time = 33;
    int64 force_display_effects = 34;
    string trace_id = 35;
    int64 effect_display_ts = 36;
    string gift_play_param = 40;
    int32 multi_send_effect_level = 41;
    bool use_room_message = 43;
    int64 count = 44;
    string video_linkmic_room_id = 45;
    repeated string to_openids = 5000;
}
