syntax = "proto3";

option java_multiple_files = true;
option java_package = "cool.scx.live_room_watcher.impl.douyin_hack.proto.webcast.im";

package webcast.im;

import "douyin_hack/webcast/im/Common.proto";
import "douyin_hack/webcast/data/User.proto";
import "douyin_hack/webcast/data/Text.proto";

// 更新时间 : 2026-07-06, extracted from live-schema-im.aa08852d.js
message DoodleGiftMessage {
    webcast.im.Common common = 1;
    int64 gift_id = 2;
    int64 fan_ticket_count = 3;
    webcast.data.User user = 4;
    webcast.data.User to_user = 5;
    string compose = 6;
    int64 room_fan_ticket_count = 7;
    bytes priority = 8;
    string log_id = 9;
    bytes public_area_common = 10;
    webcast.data.Text tray_display_text = 11;
    bytes tray_info = 12;
}
