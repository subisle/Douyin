syntax = "proto3";

option java_multiple_files = true;
option java_package = "cool.scx.live_room_watcher.impl.douyin_hack.proto.webcast.im";

package webcast.im;

import "douyin_hack/webcast/im/Common.proto";
import "douyin_hack/webcast/data/User.proto";

// 更新时间 : 2026-07-06, extracted from live-schema-im.aa08852d.js
message FreeCellGiftMessage {
    webcast.im.Common common = 1;
    int64 gift_id = 2;
    int64 fan_ticket_count = 3;
    int64 group_count = 4;
    int64 repeat_count = 5;
    int64 combo_count = 6;
    webcast.data.User user = 7;
    webcast.data.User to_user = 8;
    FreeCellData free_cell = 9;
    int64 room_fan_ticket_count = 10;
    string log_id = 11;
    bytes public_area_common = 12;

    message FreeCellData {
        int64 time_now_ms = 1;
        int64 time_start_ms = 2;
        int64 time_freeze_end_ms = 3;
        int64 time_double_end_ms = 4;
        int64 time_end_ms = 5;
        int64 free_cell_length = 6;
        bool is_freeze = 7;
        bool is_double = 8;
        webcast.data.User contribute_most_user = 9;
        int64 contribute_most_coins = 10;
        int64 distance_from_previous_one = 11;
        int64 index_in_day_ranklist = 12;
    }
}
